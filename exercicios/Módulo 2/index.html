<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 2</title>
    <link rel="stylesheet" href="../../estilos/style.css">
</head>
<body>
    <h1>Exercicios</h1>
    <h2>Estruturas de controle</h2>
    <pre><code id="codigo-tela">Carregando código...</code></pre>
    <a href="../../index.html">Voltar</a>
     <script>
        // Puxa o conteúdo do arquivo script.js
        fetch('modulo2.js')
            .then(resposta => resposta.text()) // Transforma o arquivo em texto
            .then(texto => {
                // Insere o texto dentro da tag code, tratando caracteres especiais
                document.getElementById('codigo-tela').textContent = texto;
            })
            .catch(erro => {
                document.getElementById('codigo-tela').textContent = "Erro ao carregar o arquivo.";
            });
    </script>
    <script src="modulo2.js"></script>
</body>
</html>
